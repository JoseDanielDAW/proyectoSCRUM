<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Tareas - Acceso</title>
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/sesion.js" defer></script>
  <script src="js/login.js" defer></script>
</head>
<body>

  <div class="contenedor">
    <h1 id="titulo-login">Acceso</h1>
    <p class="subtitulo">Introduce tus datos para continuar</p>

    <!-- Al ser type="submit", también funciona pulsando Enter -->
    <form id="formulario-login">
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" placeholder="Escribe tu usuario">

      <label for="clave">Contraseña</label>
      <input type="password" id="clave" placeholder="Escribe tu contraseña">

      <button type="submit" id="boton-entrar">Entrar</button>

      <p id="mensaje"></p>
    </form>

    <button type="button" id="btn-volver" class="btn-secundario">Volver</button>
  </div>

</body>
</html>
